[project]
name = "consultingcraft-ai"
version = "1.0.0"
description = "Evidence-led AI CV tailoring portfolio prototype"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
dependencies = [
  "streamlit==1.62.0",
  "groq==1.7.0",
  "python-docx==1.2.0",
  "pypdf==6.16.2",
  "Pillow==12.3.0",
  "python-dotenv==1.2.3",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
